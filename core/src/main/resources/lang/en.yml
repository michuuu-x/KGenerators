messages:
  prefix: '<dark_gray>[<gold>KGenerators<dark_gray>] '
  generators:
    any:
      owner-none: '<red>None'
      disabled-specific: '<red><generator> is disabled in this world!'
      repaired: '<green>Generator succesfully repaired!'
      no-longer-there: '<red>Generator is no longer there!'
      object-amount: <amount> x <object>
    digging:
      cant-here: '<red>You can''t dig generated blocks here!'
      only-gen: '<red>You can only dig generated blocks here!'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to mine <generator><red>!'
    crafting:
      cant-use: '<red>You cant craft anything from generator!'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to craft <generator><red>!'
    timeleft:
      output: '<green>This generator will be regenerated in <yellow><time>'
    action:
      cant-here: '<red>You cant interact with generator here!'
    pick-up:
      successful: '<yellow><generator> <green>picked up'
      cant-here: '<red>You cant pick up generator here!'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to pick up
        that type generator'
    place:
      cant-here: '<red>You cant place generator here!'
      cant-place-block: '<red>You cant place any block in generator''s place'
      cant-place-double-below-block: '<red>You cant place double generator below any
        block!'
      cant-place-double-below-generator: '<red>You cant place double generator below
        other generator!'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to place that
        type generator'
    limits:
      cant-place-more-type: '<red>You cant place more than <gold><number> <generator> <red>generators,
        because of <gold><limit><red>!'
      cant-pick-up: '<red>You cant pick up generator owned by <gold><owner><red>!'
      cant-use: '<red>You cant use generator owned by <gold><owner><red>!'
    protection:
      cant-change-generator-item: '<red>You cant change generator item!'
    menus:
      cant-open-here: '<red>You cant open this menu here!'
    chunks:
      not-loaded-yet: '<red>Database hasnt loaded this chunk yet! Wait a while!'
  economy:
    no-economy-avaible: '<red>There is no economy system avaible!'
    not-enough-money: '<red>You dont have enough money! You need <gold><cost><red>!'
  upgrades:
    upgraded: '<green>You''ve upgraded <yellow><number> <green>generators for <yellow><costs><green>!'
    gui-upgraded: '<red>You dont have <dark_red><cost><red>!'
    separator: ', '
    no-next-level: '<red>This is maximum level of that generator!'
    no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to upgrade generator!'
    not-a-generator: '<red>You dont have generator in hand!'
    costs:
      exp: xp
      exp-levels: xp levels
  hooks:
    explode-pickaxe:
      cannot-use-on-double: '<red>You cannot use explosion pickaxe on type double generator!'
  database:
    error: '<red>Database error occured, please contact with administration!'
  commands:
    any:
      wrong: '<red>Wrong command! Type /kgenerators for help'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to use KGenerators
        commands'
      player-not-online: '<red>Player is not online'
      player-doesnt-exist: '<red>Player doesnt exist'
      generator-doesnt-exist: '<red>That generator doesn''t exist'
      menu-doesnt-exist: '<red>That menu doesn''t exist'
      console-only: '<red>This command can be executed only from console!'
      not-a-integer: '<red>''<variable>'' should be integer!'
      not-a-floating-point-number: '<red>''<variable>'' should be floating point number!'
      world-doesnt-exist: '<red>World ''<world>'' doesn''t exist'
    list:
      header: '<green>Generators:'
      list: '<dark_gray>- <generator> <dark_gray>(<gray>ID: <generatorID><dark_gray>)'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to list generators'
      help: List all generators
    menu:
      opened-others: '<green>Opened <yellow><generator> <menu> menu <green>for <yellow><player>'
      error: '<red>An error occured, while using menus! Contact with administrator!'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to open menu!'
      no-permission-others: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to
        open menu for other players!'
      help: Opens menu
    give:
      generator-given: '<yellow><amount>x <green><generator> <green>was given to <yellow><player>'
      generator-recieved: '<green>You recieved <yellow><amount>x <green><generator><green>!'
      usage: '<red>Usage: <yellow>/kgenerators give <player> <generator> [amount]'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to give generators'
      help: Give generator to player
    getall:
      recieved: '<green>Generators recieved'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to get all
        generators'
      help: Get all generators
    limits:
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to open limits
        menu!'
      help: Check limits
    actions:
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to check actions!'
      help: Check possible actions
      header: '<green>Possible actions for generators:'
      list: '<gold><action> <dark_gray>- <yellow><sneak><mode><item>'
      sneak: 'sneak and '
      break: break block
      left-click: left click
      right-click: right click
      item: ' with <itemname>'
      pick-up: Pick up
      gui: Open GUI
      time-left: Time left
      upgrade: Upgrade
    timeleft:
      no-generator: '<red>You are not looking at generator waiting for regeneration!'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to check generation
        remaining time'
      help: Check time remaining to regeneration
      format:
        seconds: s
        minutes: m
        hours: h
        days: d
        none: None
    spawn:
      done: '<green>Generator spawned! New generator: <yellow><location_info>'
      usage: '<red>Usage: <yellow>/kgenerators spawn <world> <x> <y> <z> <generator> [owner]'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to spawn generator!'
      help: Spawns generator at location
    remove:
      done: '<green>Removed <amount> generators!'
      usage:
        worldedit: '<red>Usage: <yellow>/kgenerators remove worldedit'
        owner: '<red>Usage: <yellow>/kgenerators remove owner <owner>'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to remove
        generators!'
      help: Removes generators
      worldedit-not-found: '<red>Selection is not complete!'
      worldedit-wrong-selection: '<red>Selection is not complete!'
    upgrade:
      help: Upgrade generator
    reload:
      done: '<green>Plugin configuration reloaded! Check console or log.txt in plugin''''s
        directory for possible errors!'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to reload
        plugin'
      help: Plugin configuration reload
    debug:
      done: '<green>Debug file saved: <yellow><file>'
      error: '<red>An error occured, while making debug output!'
      no-permission: '<red>You dont have permission <dark_gray>(<gray><permission><dark_gray>)<red> to paste debug'
    help:
      label: '<gold><bold>KGenerators <reset><green>Commands help:'
      format: '<yellow>/kgenerators <subcommand> <gray><help>'
holograms:
  remaining-time:
  - <generator_name>
  - '<gold>Time left:'
  - '<yellow><time>'
